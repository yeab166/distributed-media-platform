server:
  port: 8082

spring:
  application:
    name: media-service
  datasource:
    url: jdbc:h2:mem:mediadb
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update

storage:
  upload-dir: uploads
