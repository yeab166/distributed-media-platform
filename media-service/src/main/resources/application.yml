server:
  port: 8082

spring:
  application:
    name: media-service
  datasource:
    url: jdbc:h2:file:./data/mediadb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

storage:
  upload-dir: uploads
