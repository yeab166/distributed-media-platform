server:
  port: 8083

spring:
  application:
    name: sharing-service
  datasource:
    url: jdbc:h2:file:./data/sharingdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
