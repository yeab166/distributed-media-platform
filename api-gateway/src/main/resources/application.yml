server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        add-to-chain: true
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            exposedHeaders: "*"
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**
        
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/users/**
          filters:
            - AuthenticationFilter

        - id: media-service
          uri: http://localhost:8082
          predicates:
            - Path=/media/**
          filters:
            - AuthenticationFilter

        - id: sharing-service
          uri: http://localhost:8083
          predicates:
            - Path=/sharing/**
          filters:
            - AuthenticationFilter

